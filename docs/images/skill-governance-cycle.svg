<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Skill governance lifecycle</title>
  <desc id="desc">Bilingual lifecycle from discovery and mapping through use, evidence, audit, safe update, backup, and rollback.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a5b4fc"/></marker>
    <filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-opacity=".28"/></filter>
    <style>.title{font:700 30px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#fff}.sub{font:15px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#c7d2fe}.h{font:700 19px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#fff}.t{font:14px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#e0e7ff}.n{font:700 16px 'Segoe UI',sans-serif;fill:#312e81}.line{stroke:#a5b4fc;stroke-width:3;fill:none;marker-end:url(#arr)}</style>
  </defs>
  <rect width="1280" height="720" rx="28" fill="url(#bg)"/>
  <text x="640" y="52" text-anchor="middle" class="title">Skill 治理循环 / Skill Governance Lifecycle</text>
  <text x="640" y="80" text-anchor="middle" class="sub">发现能力不等于证明质量；更新前先保留来源、基线和回滚路径</text>

  <g filter="url(#s)">
    <g><circle cx="190" cy="210" r="92" fill="#1d4ed8"/><circle cx="155" cy="170" r="20" fill="#dbeafe"/><text x="155" y="176" text-anchor="middle" class="n">1</text><text x="190" y="210" text-anchor="middle" class="h">发现 / Discover</text><text x="190" y="238" text-anchor="middle" class="t">共享 · 系统 · 插件</text></g>
    <g><circle cx="470" cy="200" r="92" fill="#7c3aed"/><circle cx="435" cy="160" r="20" fill="#ede9fe"/><text x="435" y="166" text-anchor="middle" class="n">2</text><text x="470" y="200" text-anchor="middle" class="h">映射 / Map</text><text x="470" y="228" text-anchor="middle" class="t">功能域 · 阶段 · 边界</text></g>
    <g><circle cx="760" cy="200" r="92" fill="#0f766e"/><circle cx="725" cy="160" r="20" fill="#ccfbf1"/><text x="725" y="166" text-anchor="middle" class="n">3</text><text x="760" y="200" text-anchor="middle" class="h">路由 / Route</text><text x="760" y="228" text-anchor="middle" class="t">主 Skill + 独立补充</text></g>
    <g><circle cx="1050" cy="210" r="92" fill="#0369a1"/><circle cx="1015" cy="170" r="20" fill="#e0f2fe"/><text x="1015" y="176" text-anchor="middle" class="n">4</text><text x="1050" y="210" text-anchor="middle" class="h">真实使用 / Use</text><text x="1050" y="238" text-anchor="middle" class="t">产物与任务 ID</text></g>
    <g><circle cx="1050" cy="500" r="92" fill="#166534"/><circle cx="1015" cy="460" r="20" fill="#dcfce7"/><text x="1015" y="466" text-anchor="middle" class="n">5</text><text x="1050" y="500" text-anchor="middle" class="h">证据 / Evidence</text><text x="1050" y="528" text-anchor="middle" class="t">成功 · 部分 · 失败</text></g>
    <g><circle cx="760" cy="550" r="92" fill="#9a3412"/><circle cx="725" cy="510" r="20" fill="#ffedd5"/><text x="725" y="516" text-anchor="middle" class="n">6</text><text x="760" y="550" text-anchor="middle" class="h">审计 / Audit</text><text x="760" y="578" text-anchor="middle" class="t">重复 · 漂移 · 就绪度</text></g>
    <g><circle cx="470" cy="550" r="92" fill="#b45309"/><circle cx="435" cy="510" r="20" fill="#fef3c7"/><text x="435" y="516" text-anchor="middle" class="n">7</text><text x="470" y="550" text-anchor="middle" class="h">安全更新 / Update</text><text x="470" y="578" text-anchor="middle" class="t">三方比较 · staging</text></g>
    <g><circle cx="190" cy="500" r="92" fill="#be123c"/><circle cx="155" cy="460" r="20" fill="#ffe4e6"/><text x="155" y="466" text-anchor="middle" class="n">8</text><text x="190" y="500" text-anchor="middle" class="h">备份与回滚</text><text x="190" y="528" text-anchor="middle" class="t">Backup &amp; rollback</text></g>
  </g>
  <path class="line" d="M282 205L378 202"/><path class="line" d="M562 200H668"/><path class="line" d="M852 202L958 207"/><path class="line" d="M1050 302V408"/><path class="line" d="M964 520L852 540"/><path class="line" d="M668 550H562"/><path class="line" d="M378 540L276 520"/><path class="line" d="M190 408V302"/>
  <rect x="455" y="300" width="370" height="120" rx="20" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
  <text x="640" y="338" text-anchor="middle" class="h">不会自动删除 / No automatic deletion</text><text x="640" y="370" text-anchor="middle" class="t">重复评分只是审查信号</text><text x="640" y="397" text-anchor="middle" class="t">替换前必须验证新版本并保留可恢复备份</text>
</svg>
